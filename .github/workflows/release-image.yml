# SPDX-License-Identifier: AGPL-3.0-or-later
# A version tag publishes the runtime image a household installs (D314 §1): built from the tag as
# deploy/release/build.sh builds it on the owner's machines, the same Containerfile and target, for
# amd64 and arm64, and pushed to GitHub's registry beside the repository as
# ghcr.io/<owner>/orpheum:<tag> and :latest, one name for both architectures.
# The package is made public once, by the owner, in its settings on GitHub (a private repository's
# packages start private).
#
# It then writes the release into the publisher's unsigned release record (D394 §8) and attaches it
# to the run as the artifact "release-record", for the owner to download, check and sign on the Mac
# (`discovery-sign sign-release`). Nothing is signed here: the publisher's keys never leave their
# devices. The repository's variables say where the record lives: PUBLISHER_PLACE, the origin
# serving the publisher's published files (unset, until the owner's ceremony made the publisher
# root: the step does nothing); PUBLISHER_ID and PUBLISHER_ROOT_VERSION, for the first record and
# after a rotation. A release fixing a security problem says so on a line of its tag's message,
# `Security: <what it fixes, in a sentence for an admin>`.
name: release-image

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

# One publish per tag; a tag pushed again replaces its run.
concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Before anything is built: the published compose files are their version's frozen copy, the test
  # fixtures every later release is held to, so a household's pasted file keeps starting (D462 §6).
  # A release whose files are not stops here, before the owner is asked to approve its publish.
  frozen-compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The published compose files are their version's frozen copy
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_released_compose.py --tag "$TAG"

  # Each architecture is built on a runner of its own kind, natively (no emulation): the image for
  # an arm64 board (a Raspberry Pi running OpenMediaVault) and the one for a PC. Each is pushed under
  # its own tag, <tag>-<arch>; the job after joins them under <tag> and :latest, which a pull on
  # either machine resolves to its own (D205, keep arm64 open).
  image:
    strategy:
      # One architecture's failure does not cancel the other's build; the joining job still publishes
      # nothing unless both pass, and a re-run then builds only the one that failed.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    needs: frozen-compose
    runs-on: ${{ matrix.runner }}
    # A publish waits for the owner's approval: the environment "release" names the owner as its
    # required reviewer, set in the repository's settings (the week's security report §3, the owner
    # 2026-10-31). A stolen token that can push a tag then still cannot publish an image. One review
    # approves both architectures' jobs, which wait on it together; the joining job pushes nothing
    # until both have run.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The job's token, which can publish images, stays out of the checkout's git config.
        with:
          persist-credentials: false
      - name: Build and push the runtime image for this architecture
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          # A registry's names are lower case; the repository's owner may not be.
          image="ghcr.io/${REPOSITORY,,}"
          test "$(docker version --format '{{.Server.Arch}}')" = "$ARCH"
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          DOCKER_BUILDKIT=1 docker build --file deploy/Containerfile --target runtime \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.version=$TAG" \
            --tag "$image:$TAG-$ARCH" .
          docker push "$image:$TAG-$ARCH"

  publish:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Join the architectures under the tag and latest
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/${REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker buildx imagetools create --tag "$image:$TAG" --tag "$image:latest" \
            "$image:$TAG-amd64" "$image:$TAG-arm64"
          docker buildx imagetools inspect "$image:$TAG"
      - name: Write the release into the unsigned release record
        if: vars.PUBLISHER_PLACE != ''
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          PLACE: ${{ vars.PUBLISHER_PLACE }}
          PUBLISHER_ID: ${{ vars.PUBLISHER_ID }}
          ROOT_VERSION: ${{ vars.PUBLISHER_ROOT_VERSION }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          image="ghcr.io/${REPOSITORY,,}"
          # The digest of the list this run joined, which names both architectures' images: a pull
          # by it gives each machine its own.
          digest="$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$image:$TAG" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["digest"])')"
          case "$digest" in sha256:*) ;; *) echo "no digest for $image:$TAG" >&2; exit 1 ;; esac
          # The record as published, payload alone; none yet before the first release. A tampered copy
          # is refused when the owner signs: discovery-sign checks it against the owner's ledger.
          status="$(curl -sS --proto '=https' -o release -w '%{http_code}' "$PLACE/.well-known/orpheum/release")"
          case "$status" in
            200) ;;
            404) rm -f release ;;
            *) echo "fetching the release record from $PLACE said $status" >&2; exit 1 ;;
          esac
          # The tag's message, through the API: the checkout keeps no annotated tag's message.
          ref="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          message=""
          if [ "${ref%% *}" = tag ]; then
            message="$(gh api "repos/$REPOSITORY/git/tags/${ref#* }" --jq .message)"
          fi
          security="$(printf '%s\n' "$message" | sed -n 's/^Security:[[:space:]]*//p' | head -n 1)"
          set -- --record release --version "$TAG" --digest "$digest" --pull "$image"
          if [ -n "$security" ]; then set -- "$@" --security "$security"; fi
          if [ -n "$PUBLISHER_ID" ]; then set -- "$@" --id "$PUBLISHER_ID"; fi
          if [ -n "$ROOT_VERSION" ]; then set -- "$@" --root-version "$ROOT_VERSION"; fi
          # The runner's Go fetches the toolchain go.mod names, checked against Go's checksum database.
          GOTOOLCHAIN=auto go run ./cmd/release-record "$@"
      - name: Attach the unsigned release record for the owner to sign
        if: vars.PUBLISHER_PLACE != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: release
          if-no-files-found: error

  # Once the image is published, never before it (D462 §10.4): the tag's compose files are attached to
  # its GitHub release, which install.md links as releases/latest/download/<file>, so a household
  # installs the file the running image was tested against, never main's (D462 §5); and the branch
  # "release" is moved to the tag, which CasaOS's catalogue entry takes its file from (D462 §10.3).
  # The files are the tag's frozen copy: the first job held them to it.
  release-files:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Attach each route's compose file to the release and move the release branch to the tag
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir files
          cp deploy/omv/compose.yaml files/orpheum-omv.yaml
          cp deploy/synology/compose.yaml files/orpheum-synology.yaml
          cp deploy/portainer/compose.yaml files/orpheum-portainer.yaml
          cp deploy/catalogue/casaos/docker-compose.yml files/orpheum-casaos.yaml
          cp deploy/docker/compose.yaml files/orpheum-docker.yaml
          # A run started again for the same tag finds its release made and replaces the files.
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" files/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" files/* --repo "$REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          # Through the API, so no credential is kept in the checkout: moved, or made the first time.
          if gh api "repos/$REPOSITORY/git/ref/heads/release" >/dev/null 2>&1; then
            gh api -X PATCH "repos/$REPOSITORY/git/refs/heads/release" -f sha="$SHA" -F force=true >/dev/null
          else
            gh api -X POST "repos/$REPOSITORY/git/refs" -f ref=refs/heads/release -f sha="$SHA" >/dev/null
          fi
