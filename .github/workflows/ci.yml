# SPDX-License-Identifier: GPL-3.0-or-later
# CI runs exactly what a developer runs: `make check` on every push and pull request, and the
# branch gates (`make check-pr`) on a pull request. No job exists only in CI — a gate that cannot
# be run locally is one people learn about too late (yoloAI DF226).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q shellcheck
          make tools
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: make check
        run: make check VERBOSE=1
      # The integration tier runs the pinned FFmpeg and MKVToolNix; each download is verified by
      # hash and cached under its pin, so a changed pin fetches afresh.
      - uses: actions/cache@v4
        with:
          path: .tools/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch_ffmpeg.py') }}
      - uses: actions/cache@v4
        with:
          path: .tools/mkvtoolnix
          key: mkvtoolnix-${{ runner.os }}-${{ hashFiles('scripts/fetch_mkvtoolnix.py') }}
      - name: Integration tier
        run: make test-integration
      # The browser tier's browsers, fetched by the pinned Playwright for its own version (make
      # browsers checks the version), with the system libraries they need; cached by the lockfile.
      - uses: actions/cache@v4
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Playwright's browsers
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: make browsers PLAYWRIGHT_INSTALL_FLAGS=--with-deps
      # Every branch that is not main runs the branch gates on every push, not only once a pull
      # request exists: yoloAI once had a release branch reach 63 commits with no CI (DF226).
      - name: Branch gates (pull request)
        if: github.event_name == 'pull_request'
        run: make check-pr VERBOSE=1 BASE=origin/${{ github.base_ref }}
      - name: Branch gates (branch push)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: make check-pr VERBOSE=1 BASE=origin/main
