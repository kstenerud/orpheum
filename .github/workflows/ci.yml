# SPDX-License-Identifier: AGPL-3.0-or-later
# CI runs exactly what a developer runs, in the same development image (D235 §2): `./dev make check`
# on every push and pull request, the branch gates (`./dev make check-pr`) on a pull request and a
# branch, and every night `./dev make check-everything` on main, the backstop to check-pr's narrowing
# (the owner, 2026-10-17). No job exists only in CI — a gate that cannot be run locally is one
# people learn about too late (yoloAI DF226) — and no tool is installed on the runner but Docker,
# which it has.
name: ci

on:
  push:
  pull_request:
  # Nightly, at 02:17 UTC, and by hand from the Actions tab.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# By event as well as ref: a push to main at night would otherwise cancel the nightly run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # ./dev keeps Go's, npm's and Playwright's caches here, which the cache step below saves. It is
      # set by a step because a job's env cannot read the runner context.
      - name: The development caches' directory
        run: echo "ORPHEUM_DEV_CACHE_DIR=$RUNNER_TEMP/dev-cache" >> "$GITHUB_ENV"
      # The image is built once per change to its inputs: its tag hashes them (./dev --image-tag),
      # and a run with that tag cached loads it rather than building (the jobs rebuild's step 4a′).
      - name: The development image's tag
        id: image
        run: echo "tag=$(./dev --image-tag)" >> "$GITHUB_OUTPUT"
      - name: Restore the development image
        id: restore-image
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dev-image.tar.zst
          key: dev-image-${{ steps.image.outputs.tag }}
      - name: Load the development image
        if: steps.restore-image.outputs.cache-hit == 'true'
        run: zstd -d -c "$RUNNER_TEMP/dev-image.tar.zst" | docker load
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dev-cache
          key: dev-cache-${{ runner.os }}-${{ hashFiles('go.sum', 'web/package-lock.json') }}
          restore-keys: dev-cache-${{ runner.os }}-
      - name: make check
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./dev make check VERBOSE=1
      - name: Save the development image
        if: steps.restore-image.outputs.cache-hit != 'true'
        run: docker save "${{ steps.image.outputs.tag }}" | zstd -T0 -3 > "$RUNNER_TEMP/dev-image.tar.zst"
      - if: steps.restore-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dev-image.tar.zst
          key: dev-image-${{ steps.image.outputs.tag }}
      # The integration tier runs the pinned FFmpeg and MKVToolNix, which the image holds.
      - name: Integration tier
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        run: ./dev make test-integration
      # The browser tier's browsers, fetched by the pinned Playwright into the cache directory; the
      # image holds the system libraries they need.
      - name: Playwright's browsers
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        run: ./dev make browsers
      # Every branch that is not main runs the branch gates on every push, not only once a pull
      # request exists: yoloAI once had a release branch reach 63 commits with no CI (DF226).
      - name: Branch gates (pull request)
        if: github.event_name == 'pull_request'
        run: ./dev make check-pr VERBOSE=1 BASE=origin/${{ github.base_ref }}
      - name: Branch gates (branch push)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: ./dev make check-pr VERBOSE=1 BASE=origin/main
      # The nightly run: everything, trusting no stamp, cache or map, each step to its end.
      - name: Everything (nightly)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./dev make check-everything VERBOSE=1
