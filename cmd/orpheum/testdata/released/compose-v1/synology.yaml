# SPDX-License-Identifier: AGPL-3.0-or-later
# Orpheum on a Synology, from Container Manager with no .env file: paste it into Project > Create >
# Create docker-compose.yml, change the lines under "Yours" to your own, and start it. Its data is in
# the project's own folder, data/.
#
# Generated from internal/deployment/templates/household.yaml (make generate); edit that. The server
# writes its deployment at every start from what this file tells it; every other setting, its
# address at home, its HTTPS port and your router among them, is on its System page. Until the first
# admin is made, the setup code is in SETUP-CODE.txt in the data folder, and in orpheum-core's log.
# docs/users/install.md says how, step by step. To update, see the server's Update page.
#
# It asks the kernel for nothing (D454 §2): no setting, no network of its own beside this machine's.
#
# Keep a copy of this file. A newer one, which the Update page hands you with your values filled in,
# keeps only what is under "Yours": a change anywhere else is lost when you paste it.

# Yours: change these to your own (install.md, Synology, steps 1 and 3).
x-yours:
  # The folder that holds your films and series: File Station, its Properties, Location.
  media: &media /volume1/video
  # Up to three more media folders; /unset/2 and the like are none.
  media-2: &media2 /unset/2
  media-3: &media3 /unset/3
  media-4: &media4 /unset/4
  # The user the server runs as, which owns its data and must be able to read the media: the uid
  # and gid `id` shows, the uid first.
  user: &user "1026:100"
  # Your time zone.
  time-zone: &timezone Europe/Berlin
  # The port a browser at home opens it on, http://<address>:8440, and the one a browser on this
  # machine alone opens it on, http://127.0.0.1:8441.
  http-port: &httpport "8440"
  this-machine-port: &thismachineport "8441"

services:
  # Makes the data's folders and gives them to the user the server runs as, once, before it starts:
  # Docker makes a missing folder as root, which the server, never root, could not write.
  orpheum-folders:
    container_name: orpheum-folders
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /appdata/node /appdata/run && chown $$OWNER /appdata /appdata/node /appdata/run"]
    environment:
      OWNER: *user
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/appdata
    restart: "no"

  # The server: the API, the web client, HTTPS at home by its LAN name, WebRTC. It writes the
  # deployment at every start, its own instance and the node's the first time. It shares this
  # machine's network (D454 §5), so it sees the house's addresses and takes its ports itself: plain
  # HTTP, HTTPS and WebRTC (UDP) at home, and this machine's port on its loopback alone.
  orpheum-core:
    container_name: orpheum-core
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: *user
    hostname: ${ORPHEUM_NAME:-orpheum}
    command:
      - start
      # Which file this is, so the Update page shows its own steps (D461 §3, D462 §9).
      - --compose-version
      - "1"
      - --compose-file
      - synology
      - --image-tag
      - ${ORPHEUM_TAG:-latest}
      - --http-port
      - *httpport
      - --this-machine-port
      - *thismachineport
      # Each media folder by the path the node mounts it at, its own; one not set is no folder.
      - --media
      - *media
      - --media
      - *media2
      - --media
      - *media3
      - --media
      - *media4
    environment:
      TZ: *timezone
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - ./data:/var/lib/orpheum
      - ./data/run:/run/orpheum
    depends_on:
      orpheum-folders:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # /api/v1/health answers while the server starts, migrates or is degraded, and says which.
      # Asked on this machine's loopback, where the core takes the port a browser here opens.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/$$0 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3", *thismachineport]
      interval: 10s
      start_period: 60s

  # The media node (D233 §2): every file read and FFmpeg run, confined (D193 §7). It sees the media,
  # read-only, its own instance, which the core's first start wrote, and the sockets in run/ it reaches
  # the core by; it has no network. Its root is read-only and /tmp a tmpfs nothing runs from (noexec).
  orpheum-node:
    container_name: orpheum-node
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: *user
    command: ["node", "--instance", "/var/lib/orpheum/node"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/node:/var/lib/orpheum/node
      - ./data/run:/run/orpheum
      # Each media folder at its own path, so the server shows the name this machine gives it. The
      # first, if it does not exist, stops the start naming its path, rather than Docker making it
      # empty.
      # Another one not set is made empty at its /unset/ path, where nothing looks; the core's command
      # skips it (D449 §4).
      - type: bind
        source: *media
        target: *media
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: *media2
        target: *media2
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: *media3
        target: *media3
        read_only: true
        bind:
          create_host_path: true
      - type: bind
        source: *media4
        target: *media4
        read_only: true
        bind:
          create_host_path: true
    # A GPU for hardware encoding (Intel Quick Sync, AMD): uncomment both, with RENDER_GID the render
    # group's number on this machine (ls -n /dev/dri/renderD128 shows it, often 105 or 106).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    depends_on:
      orpheum-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/run/orpheum/node/node.sock"]
      interval: 10s
      start_period: 30s
