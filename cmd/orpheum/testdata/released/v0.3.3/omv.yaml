# Orpheum from one compose file (D447): paste it into OpenMediaVault's Services > Compose > Files, or
# put it in a folder of its own beside a .env file on any machine with Docker, and start it. The core
# writes the deployment into ${PATH_TO_APPDATA}/orpheum at every start from the variables below, which
# compose fills into its command line (a release reads no environment but TZ, D204): change one here
# and start it again (D449). docs/users/install.md says how, step by step. Until the first admin is
# made, the setup code is in SETUP-CODE.txt in that folder, and in orpheum-core's log.
#
# Needed:
#   PATH_TO_APPDATA       the folder that holds each app's data: OpenMediaVault's global.env sets it
#   ORPHEUM_MEDIA         the folder that holds your films and series, as this machine names it; the
#                         server shows it by that name
# Optional:
#   ORPHEUM_LAN_ADDRESS   this machine's address on your home network, 192.168.1.20: learned from the
#                         first browser at home when not set, and the setup page asks if it cannot tell
#   ORPHEUM_TAG           the release to run: latest, the default, follows each release, which
#                         Pull then Up takes (D450 §2); a version such as v0.3.0 stays on it
#   ORPHEUM_MEDIA_2, ORPHEUM_MEDIA_3, ORPHEUM_MEDIA_4  more media folders, as this machine names them;
#                         one not set is none
#   APPUSER_PUID, APPUSER_PGID  who the server runs as and owns its data: global.env sets them
#   TIME_ZONE_VALUE       the time zone, Europe/Berlin: global.env sets it
#   ORPHEUM_HTTP_PORT     the port a browser at home opens it on, http://<address>:8440
#   ORPHEUM_HTTPS_PORT    the port devices at home reach it on over HTTPS, and over WebRTC (UDP), by the
#                         name its discovery gives this machine; 8444, as OpenMediaVault's own web UI
#                         may take 8443
#   ORPHEUM_THIS_MACHINE_PORT  the port a browser on this machine alone opens it on, as at home,
#                         http://127.0.0.1:8441: the way in when admin is refused elsewhere (D334 §4)
#   ORPHEUM_ROUTER        your router's address, 192.168.1.1, which the server asks to forward the HTTPS
#                         port so devices away from home reach it; left empty, nothing is mapped
#   ORPHEUM_NAME          the name the media node goes by in the server's pages
#   RENDER_GID            the render group's number, with the GPU lines below uncommented
#
# It asks the kernel for nothing (D454 §2): no setting, no network of its own beside this machine's.

services:
  # Makes the data's folders and gives them to the user the server runs as, once, before it starts:
  # Docker makes a missing folder as root, which the server, never root, could not write.
  orpheum-folders:
    container_name: orpheum-folders
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # empty/ stands in for a media folder not set (ORPHEUM_MEDIA_2 to _4): a bind needs a source.
    command: ["mkdir -p /appdata/node /appdata/run /appdata/empty && chown ${APPUSER_PUID:-1000}:${APPUSER_PGID:-100} /appdata /appdata/node /appdata/run"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${PATH_TO_APPDATA:?set PATH_TO_APPDATA to the folder that holds each app's data}/orpheum:/appdata
    restart: "no"

  # The server: the API, the web client, HTTPS at home by its LAN name, WebRTC. It writes the
  # deployment at every start, its own instance and the node's the first time. It shares this
  # machine's network (D454 §5), so it sees the house's addresses and takes its ports itself: plain
  # HTTP, HTTPS and WebRTC (UDP) at home, and this machine's port on its loopback alone.
  orpheum-core:
    container_name: orpheum-core
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: "${APPUSER_PUID:-1000}:${APPUSER_PGID:-100}"
    hostname: ${ORPHEUM_NAME:-orpheum}
    command:
      - start
      # Learned from the first browser at home when not set (D452 §5).
      - --lan-address
      - ${ORPHEUM_LAN_ADDRESS:-}
      - --http-port
      - ${ORPHEUM_HTTP_PORT:-8440}
      - --lan-https-port
      - ${ORPHEUM_HTTPS_PORT:-8444}
      - --lan-webrtc-port
      - ${ORPHEUM_HTTPS_PORT:-8444}
      - --this-machine-port
      - ${ORPHEUM_THIS_MACHINE_PORT:-8441}
      - --router
      - ${ORPHEUM_ROUTER:-}
      # Each media folder by the path the node mounts it at, its own; one not set comes empty, no folder.
      - --media
      - ${ORPHEUM_MEDIA:?set ORPHEUM_MEDIA to the folder that holds your films and series}
      - --media
      - ${ORPHEUM_MEDIA_2:-}
      - --media
      - ${ORPHEUM_MEDIA_3:-}
      - --media
      - ${ORPHEUM_MEDIA_4:-}
    environment:
      TZ: ${TIME_ZONE_VALUE:-Etc/UTC}
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - ${PATH_TO_APPDATA:?}/orpheum:/var/lib/orpheum
      - ${PATH_TO_APPDATA:?}/orpheum/run:/run/orpheum
    depends_on:
      orpheum-folders:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # /api/v1/health answers while the server starts, migrates or is degraded, and says which.
      # Asked on this machine's loopback, where the core takes the port a browser here opens.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${ORPHEUM_THIS_MACHINE_PORT:-8441} && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      start_period: 60s

  # The media node (D233 §2): every file read and FFmpeg run, confined (D193 §7). It sees the media,
  # read-only, its own instance, which the core's first start wrote, and the sockets in run/ it reaches
  # the core by; it has no network. Its root is read-only and /tmp a tmpfs nothing runs from (noexec).
  orpheum-node:
    container_name: orpheum-node
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: "${APPUSER_PUID:-1000}:${APPUSER_PGID:-100}"
    command: ["node", "--instance", "/var/lib/orpheum/node"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ${PATH_TO_APPDATA:?}/orpheum/node:/var/lib/orpheum/node
      - ${PATH_TO_APPDATA:?}/orpheum/run:/run/orpheum
      # Each media folder at its own path, so the server shows the name this machine gives it. One not
      # set mounts the empty folder where nothing looks; the core's command skips it (D449 §4). The
      # first, if it does not exist, stops the start naming its path, rather than Docker making it
      # empty. The others cannot: compose makes every container before orpheum-folders makes empty/.
      - type: bind
        source: ${ORPHEUM_MEDIA:?set ORPHEUM_MEDIA to the folder that holds your films and series}
        target: ${ORPHEUM_MEDIA}
        read_only: true
        bind:
          create_host_path: false
      - ${ORPHEUM_MEDIA_2:-${PATH_TO_APPDATA}/orpheum/empty}:${ORPHEUM_MEDIA_2:-/unset/2}:ro
      - ${ORPHEUM_MEDIA_3:-${PATH_TO_APPDATA}/orpheum/empty}:${ORPHEUM_MEDIA_3:-/unset/3}:ro
      - ${ORPHEUM_MEDIA_4:-${PATH_TO_APPDATA}/orpheum/empty}:${ORPHEUM_MEDIA_4:-/unset/4}:ro
    # A GPU for hardware encoding (Intel Quick Sync, AMD): uncomment both, with RENDER_GID the render
    # group's number on this machine (ls -n /dev/dri/renderD128 shows it, often 105 or 106).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    depends_on:
      orpheum-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/run/orpheum/node/node.sock"]
      interval: 10s
      start_period: 30s
