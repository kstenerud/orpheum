# Staging's end of the WireGuard tunnel, in `wg setconf`'s format: ./staging writes it into
# .staging/tunnel/wg0.conf on every start, with the key it made and the VPS's from
# .staging/staging.toml. The addresses and the routing are deploy/staging/tunnel.sh's.

[Interface]
PrivateKey = {private_key}

[Peer]
# The VPS (deploy/vps/vps-wg0.conf), whose AllowedIPs name this end's 10.77.0.2 and fd77::2.
PublicKey = {vps_public_key}
Endpoint = {vps_endpoint}
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
