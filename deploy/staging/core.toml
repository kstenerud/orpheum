# Staging's core config (D249 §3): ./staging writes it over the core instance's
# persistent/config.toml on every start, filling in the {placeholders} from .staging/staging.toml.
# It holds only what must exist before the database opens (D182 §3, D200); everything else is a
# setting, changed in the web client.
#
# Staging's choices, which release's own config makes again:
#   - plain HTTP on :8440 for the house's network, which the tunnel service publishes; HTTPS on
#     :443 and TURN on the tunnel's address for everyone else, through the VPS (D243 §6-§8).
#   - a database it cannot bring forward is set aside and started again (D249 §4); release refuses.
#   - logs as text, because a person reads them with `./staging logs`.

[server]
listen = "0.0.0.0:8440"
read_header_timeout_seconds = 10
shutdown_grace_seconds = 10

[https]
domain = "{domain}"
contact = "{contact}"
listen = ":443"
# Production, as the phones that test staging trust only its certificates; Let's Encrypt's staging
# directory spends no quota, for a server no real browser opens (D261 §5).
acme_directory = "https://acme-v02.api.letsencrypt.org/directory"

[turn]
public_address = "{public_ipv4}"
listen = "10.77.0.2:3478"
relay_port_min = 49160
relay_port_max = 49199

[database]
read_connections_minimum = 4
migrate_free_space_db_multiple = 3
when_unmigratable = "start_over"

[log]
level = "debug"
format = "text"
destination = "stderr"
