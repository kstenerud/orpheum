# Staging's node config (D249 §3): ./staging writes it over the node instance's
# persistent/config.toml on every start, filling in the {placeholders} from .staging/staging.toml.
# The media directories are mounted read-only at their own paths, so a library names the path the
# owner knows.

[node]
name = {node_name}   # staging.toml's [node] name, or this machine's host name
core_socket = "/run/orpheum/core/core.sock"
root_paths = {media_roots}
ffmpeg_dir = "/opt/orpheum/ffmpeg"
confinement_policy = "require"
max_errors_per_root = 1000
probe_timeout_seconds = 60
status_interval_seconds = 10
progress_every_seconds = 2
ended_work_kept_hours = 168
read_header_timeout_seconds = 10
prepared_budget_gib = 200
prepared_kept_after_play_hours = 72
prepared_disk_used_limit_percent = 95
prepared_disk_min_free_mib = 1024
encode_slot_count = 1
remux_slot_count = 2
slowest_read_mib_per_second = 20

[log]
level = "debug"
format = "text"
destination = "stderr"
