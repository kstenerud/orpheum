# Orpheum on a Synology, from Container Manager with no .env file (D447): deploy/omv/compose.yaml with
# your three values written here, under "Yours", in place of its variables, and its data in the
# project's own folder, data/. Paste it into Container Manager's Project > Create > Create
# docker-compose.yml, change the three lines under "Yours" to your own, and start it.
# docs/users/install.md says how, step by step. Keep it in step with that file:
# TestSynologyCompose_IsTheOMVOnesWithItsValuesInTheFile fails on any other difference.
#
# The core writes the deployment into data/ at every start from the values here (D449): change one
# and start the project again. Until the first admin is made, the setup code is in SETUP-CODE.txt in
# data/, and in orpheum-core's log. Every other setting keeps the default deploy/omv/compose.yaml's
# header names; a .env file in the project's folder may still set any of them.

# Yours: change these three to your own (install.md, Synology, steps 1 and 3).
x-yours:
  # The folder that holds your films and series: File Station, its Properties, Location.
  media: &media /volume1/video
  # The user the server runs as, which owns its data and must be able to read the media: the uid
  # and gid `id` shows, the uid first.
  user: &user "1026:100"
  # Your time zone.
  time-zone: &timezone Europe/Berlin

services:
  # Makes the data's folders and gives them to the user the server runs as, once, before it starts:
  # Docker makes a missing folder as root, which the server, never root, could not write.
  orpheum-folders:
    container_name: orpheum-folders
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    # empty/ stands in for a media folder not set (ORPHEUM_MEDIA_2 to _4): a bind needs a source.
    command: ["mkdir -p /appdata/node /appdata/run /appdata/empty && chown $$OWNER /appdata /appdata/node /appdata/run"]
    environment:
      OWNER: *user
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data:/appdata
    restart: "no"

  # The server: the API, the web client, HTTPS at home by its LAN name, WebRTC. It writes the
  # deployment at every start, its own instance and the node's the first time. It shares this
  # machine's network (D454 §5), so it sees the house's addresses and takes its ports itself: plain
  # HTTP, HTTPS and WebRTC (UDP) at home, and this machine's port on its loopback alone.
  orpheum-core:
    container_name: orpheum-core
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: *user
    hostname: ${ORPHEUM_NAME:-orpheum}
    command:
      - start
      # Learned from the first browser at home when not set (D452 §5).
      - --lan-address
      - ${ORPHEUM_LAN_ADDRESS:-}
      - --http-port
      - ${ORPHEUM_HTTP_PORT:-8440}
      - --lan-https-port
      - ${ORPHEUM_HTTPS_PORT:-8444}
      - --lan-webrtc-port
      - ${ORPHEUM_HTTPS_PORT:-8444}
      - --this-machine-port
      - ${ORPHEUM_THIS_MACHINE_PORT:-8441}
      - --router
      - ${ORPHEUM_ROUTER:-}
      # Each media folder by the path the node mounts it at, its own; one not set comes empty, no folder.
      - --media
      - *media
      - --media
      - ${ORPHEUM_MEDIA_2:-}
      - --media
      - ${ORPHEUM_MEDIA_3:-}
      - --media
      - ${ORPHEUM_MEDIA_4:-}
    environment:
      TZ: *timezone
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    network_mode: host
    volumes:
      - ./data:/var/lib/orpheum
      - ./data/run:/run/orpheum
    depends_on:
      orpheum-folders:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      # /api/v1/health answers while the server starts, migrates or is degraded, and says which.
      # Asked on this machine's loopback, where the core takes the port a browser here opens.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${ORPHEUM_THIS_MACHINE_PORT:-8441} && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      start_period: 60s

  # The media node (D233 §2): every file read and FFmpeg run, confined (D193 §7). It sees the media,
  # read-only, its own instance, which the core's first start wrote, and the sockets in run/ it reaches
  # the core by; it has no network. Its root is read-only and /tmp a tmpfs nothing runs from (noexec).
  orpheum-node:
    container_name: orpheum-node
    image: ghcr.io/kstenerud/orpheum:${ORPHEUM_TAG:-latest}
    user: *user
    command: ["node", "--instance", "/var/lib/orpheum/node"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./data/node:/var/lib/orpheum/node
      - ./data/run:/run/orpheum
      # Each media folder at its own path, so the server shows the name this machine gives it. One not
      # set mounts the empty folder where nothing looks; the core's command skips it (D449 §4). The
      # first, if it does not exist, stops the start naming its path, rather than Docker making it
      # empty. The others cannot: compose makes every container before orpheum-folders makes empty/.
      - type: bind
        source: *media
        target: *media
        read_only: true
        bind:
          create_host_path: false
      - ${ORPHEUM_MEDIA_2:-./data/empty}:${ORPHEUM_MEDIA_2:-/unset/2}:ro
      - ${ORPHEUM_MEDIA_3:-./data/empty}:${ORPHEUM_MEDIA_3:-/unset/3}:ro
      - ${ORPHEUM_MEDIA_4:-./data/empty}:${ORPHEUM_MEDIA_4:-/unset/4}:ro
    # A GPU for hardware encoding (Intel Quick Sync, AMD): uncomment both, with RENDER_GID the render
    # group's number on this machine (ls -n /dev/dri/renderD128 shows it, often 105 or 106).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID}"
    depends_on:
      orpheum-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/run/orpheum/node/node.sock"]
      interval: 10s
      start_period: 30s
