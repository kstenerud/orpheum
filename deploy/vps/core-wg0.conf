# /etc/wireguard/wg0.conf on the core's machine: dials the VPS, and sends back through the tunnel
# everything that leaves from the tunnel's addresses, the answers to what came in through it.
# Replace the two keys and the VPS's IPv6 address. DS-Lite has native IPv6, so the tunnel goes over
# it; a VPS reached over IPv4 works too, through the carrier's NAT, which the keepalive holds open.

[Interface]
Address = 10.77.0.2/24, fd77::2/64
PrivateKey = <the core machine's private key>
# Not the machine's default route: only what leaves from the tunnel's addresses goes back through it.
Table = off
PostUp = ip -4 rule add from 10.77.0.2 lookup 51820; ip -4 route add default dev wg0 table 51820
PostUp = ip -6 rule add from fd77::2 lookup 51820; ip -6 route add default dev wg0 table 51820
PostDown = ip -4 rule del from 10.77.0.2 lookup 51820; ip -6 rule del from fd77::2 lookup 51820

[Peer]
# The VPS.
PublicKey = <the VPS's public key>
Endpoint = [2001:db8::7]:51820
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
