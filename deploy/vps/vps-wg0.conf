# /etc/wireguard/wg0.conf on the VPS: the tunnel's far end, which the core's machine dials.
# Replace the two keys. `wg genkey | tee private | wg pubkey > public` makes a pair.

[Interface]
Address = 10.77.0.1/24, fd77::1/64
ListenPort = 51820
PrivateKey = <the VPS's private key>
# No PostUp: forwarding is switched on by 99-orpheum-forwarding.conf and the port forwards are
# loaded by orpheum-forwards.service. Ubuntu confines wg-quick with AppArmor, which refuses it, even
# as root, both the sysctl and reading the nftables file (the owner's VPS, 2026-10-06).

[Peer]
# The core's machine.
PublicKey = <the core machine's public key>
AllowedIPs = 10.77.0.2/32, fd77::2/128
