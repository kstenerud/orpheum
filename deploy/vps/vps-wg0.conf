# /etc/wireguard/wg0.conf on the VPS: the tunnel's far end, which the core's machine dials.
# Replace the two keys. `wg genkey | tee private | wg pubkey > public` makes a pair.

[Interface]
Address = 10.77.0.1/24, fd77::1/64
ListenPort = 51820
PrivateKey = <the VPS's private key>
# Forwarding and the port forwards are the nftables file's; load them with the tunnel.
PostUp = sysctl -q -w net.ipv4.ip_forward=1 net.ipv6.conf.all.forwarding=1; nft -f /etc/wireguard/orpheum.nft
PostDown = nft delete table inet orpheum

[Peer]
# The core's machine.
PublicKey = <the core machine's public key>
AllowedIPs = 10.77.0.2/32, fd77::2/128
