# SPDX-License-Identifier: AGPL-3.0-or-later
# The deployment's core config (D249, D272 §3): `orpheum write-deployment` writes it over the core
# instance's persistent/config.toml from the values file, so an edit here is lost; change the values
# file and write the deployment again. It holds only what must exist before the database opens
# (D182 §3, D200); everything else is a setting, changed in the web client.
#
#   - plain HTTP for the house's network; HTTPS for devices at home by its LAN name: with no tunnel
#     on this machine's network, whose ports they are (D454 §5), and with one in the core's own
#     network, on 8440 and 443, published; with a tunnel, HTTPS and TURN for everyone else through the VPS (D243 §6-§8), and with
#     none, no relay: the core is reached through its discovery over WebRTC (D314 §3, §4).
#   - a database it cannot bring forward: staging sets it aside and starts again (D249 §4);
#     release refuses, as D181 does.
#   - logs as text, because a person reads them with `docker compose logs`; staging's at debug.

[server]
listen = {{toml .Values.PlainListen}}
# Plain HTTP for a browser on this machine alone, on its loopback: a request on it is from home
# (D334 §4).
this_machine_listen = {{toml .Values.ThisMachineListen}}
read_header_timeout_seconds = 10
shutdown_grace_seconds = 10
# Names the house reaches the plain listener by, beside its addresses and local names; the HTTPS
# name is added on its own.
host_names = []
# Where an admin administers from, reaching the server directly: always any private network but the
# tunnel's and this machine's own (Docker's), with loopback and its own public IPv6 /64 (D452 §1, §2);
# home_networks adds others, a VPN's say, under the same exceptions.
home_networks = []
not_home_networks = {{toml .Values.NotHomeNetworks}}
# With no tunnel the core shares this machine's network (D454 §5), and takes the address of the
# interface carrying the default route as its address at home until a browser at home teaches it or
# an admin sets it; behind a tunnel its default route is its container's bridge, so it guesses none.
address_at_home_from_default_route = {{not .Values.HasTunnel}}
# How this server was installed, the install script or a compose file: the System page shows only that
# way's steps to update (D450 §2).
install_route = {{toml .InstallRoute}}
# The version of the compose file that started it, 0 for the install script: the System page says when
# a newer one brings something (D461 §3).
compose_version = {{.ComposeVersion}}

[https]
domain = {{toml .Values.Domain}}
contact = {{toml .Values.Contact}}
listen = {{toml .Values.HTTPSListen}}
# Production, as the phones that test staging trust only its certificates; Let's Encrypt's staging
# directory spends no quota, for a server no real browser opens (D261 §5).
acme_directory = "https://acme-v02.api.letsencrypt.org/directory"

[turn]
# Empty with no tunnel, which serves no relay (D314 §4).
public_address = {{toml .Values.TURNPublicAddress}}
listen = {{toml .Values.TURNListen}}
relay_port_min = 49160
relay_port_max = 49199

[discovery]
# The VPS's public addresses, which it forwards to this core: sent to a discovery to publish; none
# with no tunnel.
configured_addresses = {{toml .Values.ConfiguredAddresses}}
# This machine's address at home and its published HTTPS port, which the core's container cannot see:
# sent to a discovery to name for devices at home.
lan_addresses = {{toml .Values.LANAddresses}}
# Behind a tunnel the core's container sees only its own network and the tunnel, which nothing at home
# reaches: it sends none of them, only the addresses above. With no tunnel it shares this machine's
# network, and sends the machine's own addresses.
send_interface_addresses = {{not .Values.HasTunnel}}
# The house's public IPv6 /64s, for a house whose devices cannot reach the core directly over WebRTC,
# which teaches the core them by itself: the discovery recognises the house's devices by them. Stale
# when the provider moves the prefix.
house_ipv6_networks = []
# The house's router, which port mapping asks to forward this machine's published HTTPS port: the
# machine's default gateway, which the core's container cannot see, as its default route is its own
# network's bridge. Empty maps nothing, and the System page says to name it.
router = {{toml .Values.LAN.Router}}

[webrtc]
# The UDP port WebRTC is taken on, published at this machine's address at home on the same port, which
# the core offers devices at home so they reach it in the house, not through the VPS (D300).
udp_port = {{.Values.WebRTCUDPPort}}
# The STUN servers the core finds its public addresses through: its own, never its discovery's, since
# an IPv6 address one finds names the house's network, which administers (the Plex-chain review's L3).
stun_servers = ["stun:stun.cloudflare.com:3478"]
# The most WebRTC connections the core holds at once, of every network: a client opens up to four, so
# 64 holds 16 remote devices, Watch Together guests among them (D348).
max_connections = 64

[database]
read_connections_minimum = 4
migrate_free_space_db_multiple = 3
when_unmigratable = {{if .IsStaging}}"start_over"{{else}}"refuse"{{end}}

[log]
level = {{if .IsStaging}}"debug"{{else}}"info"{{end}}
format = "text"
destination = "stderr"
