# SPDX-License-Identifier: AGPL-3.0-or-later
# The deployment's core config (D249, D272 §3): `orpheum write-deployment` writes it over the core
# instance's persistent/config.toml from the values file, so an edit here is lost; change the values
# file and write the deployment again. It holds only what must exist before the database opens
# (D182 §3, D200); everything else is a setting, changed in the web client.
#
#   - plain HTTP on :8440 for the house's network; HTTPS on :443 for devices at home by its LAN
#     name; with a tunnel, HTTPS and TURN for everyone else through the VPS (D243 §6-§8), and with
#     none, no relay: the core is reached through its discovery over WebRTC (D314 §3, §4).
#   - a database it cannot bring forward: staging sets it aside and starts again (D249 §4);
#     release refuses, as D181 does.
#   - logs as text, because a person reads them with `docker compose logs`; staging's at debug.

[server]
listen = "0.0.0.0:8440"
# Plain HTTP for a browser on this machine alone, which the deployment publishes on its loopback: a
# request on it is from home (D334 §4).
this_machine_listen = "0.0.0.0:{{.Values.HTTP.ThisMachinePort}}"
read_header_timeout_seconds = 10
shutdown_grace_seconds = 10
# Names the house reaches the plain listener by, beside its addresses and local names; the HTTPS
# name is added on its own.
host_names = []
# Where an admin administers from, reaching the server directly: the house's network alone, never the
# tunnel's (D297 §6).
home_networks = {{toml .Values.HomeNetworks}}

[https]
domain = {{toml .Values.Domain}}
contact = {{toml .Values.Contact}}
listen = ":443"
# Production, as the phones that test staging trust only its certificates; Let's Encrypt's staging
# directory spends no quota, for a server no real browser opens (D261 §5).
acme_directory = "https://acme-v02.api.letsencrypt.org/directory"

[turn]
# Empty with no tunnel, which serves no relay (D314 §4).
public_address = {{toml .Values.TURNPublicAddress}}
listen = {{toml .Values.TURNListen}}
relay_port_min = 49160
relay_port_max = 49199

[discovery]
# The VPS's public addresses, which it forwards to this core: sent to a discovery to publish; none
# with no tunnel.
configured_addresses = {{toml .Values.ConfiguredAddresses}}
# This machine's address at home and its published HTTPS port, which the core's container cannot see:
# sent to a discovery to name for devices at home.
lan_addresses = {{toml .Values.LANAddresses}}
# In its container the core sees only the container's network and its tunnel, which nothing at home
# reaches: it sends none of them, only the addresses above.
send_interface_addresses = false

[webrtc]
# The UDP port WebRTC is taken on, published at this machine's address at home on the same port, which
# the core offers devices at home so they reach it in the house, not through the VPS; 0 with no address
# at home (D300).
udp_port = {{.Values.WebRTCUDPPort}}
# The STUN servers the core finds its public addresses through: its own, never its discovery's, since
# an IPv6 address one finds names the house's network, which administers (the Plex-chain review's L3).
stun_servers = ["stun:stun.cloudflare.com:3478"]

[database]
read_connections_minimum = 4
migrate_free_space_db_multiple = 3
when_unmigratable = {{if .IsStaging}}"start_over"{{else}}"refuse"{{end}}

[log]
level = {{if .IsStaging}}"debug"{{else}}"info"{{end}}
format = "text"
destination = "stderr"
