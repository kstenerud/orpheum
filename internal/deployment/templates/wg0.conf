# The deployment's end of the WireGuard tunnel, in `wg setconf`'s format: `orpheum
# write-deployment` writes it into tunnel/wg0.conf with the key it made and the VPS's from the
# values file. The addresses and the routing are deploy/staging/tunnel.sh's.

[Interface]
PrivateKey = {{.PrivateKey}}

[Peer]
# The VPS (deploy/vps/vps-wg0.conf), whose AllowedIPs name this end's 10.77.0.2 and fd77::2.
PublicKey = {{.Values.VPS.PublicKey}}
Endpoint = {{.Values.VPS.Endpoint}}
AllowedIPs = 0.0.0.0/0, ::/0
PersistentKeepalive = 25
