# The deployment's node config (D249, D272 §3): `orpheum write-deployment` writes it over the node
# instance's persistent/config.toml from the values file, so an edit here is lost. The media
# directories are mounted read-only at their own paths, so a library names the path the owner knows.

[node]
name = {{toml .Values.Node.Name}}   # the values file's [node] name, or this machine's host name
core_socket = "/run/orpheum/core/core.sock"
root_paths = {{toml .Values.Media.Roots}}
ffmpeg_dir = "/opt/orpheum/ffmpeg"
confinement_policy = "require"
max_errors_per_root = 1000
probe_timeout_seconds = 60
status_interval_seconds = 10
progress_every_seconds = 2
ended_work_kept_hours = 168
read_header_timeout_seconds = 10
prepared_budget_gib = 200
prepared_kept_after_play_hours = 72
prepared_watched_minutes = 10
prepared_disk_used_limit_percent = 95
prepared_disk_min_free_mib = 1024
encode_slot_count = 1
remux_slot_count = 2
slowest_read_mib_per_second = 20
watch_quiet_seconds = 30

[log]
level = {{if .IsStaging}}"debug"{{else}}"info"{{end}}
format = "text"
destination = "stderr"
