# SPDX-License-Identifier: AGPL-3.0-or-later
# Orpheum's deployment (D235 §4, D249 §2, D272 §3): three services from the one runtime image.
# `orpheum write-deployment` writes this file into the deployment's directory, beside the .env file
# it reads its variables from and compose.override.yaml, which gives the node this machine's media
# and GPU; `docker compose up -d` in that directory starts it. Paths are the directory's own.
#
#   COMPOSE_PROJECT_NAME  orpheum, or orpheum-staging
#   ORPHEUM_IMAGE      the runtime image
#   ORPHEUM_UID/GID    who the core and the node run as: the owner of the directory
#   ORPHEUM_HTTP_PUBLISH, ORPHEUM_HTTP_PORT   where the house's network reaches plain HTTP
#   ORPHEUM_THIS_MACHINE_PORT  plain HTTP for a browser on this machine alone, on its loopback
#   ORPHEUM_LAN_HTTPS_PORT   where it reaches HTTPS, by the name the discovery gives this machine
#   ORPHEUM_LAN_WEBRTC_PORT  the UDP port it reaches WebRTC on there, the same inside
#   ORPHEUM_OUTSIDE_IPV6_SUBNET  the outside network's private IPv6 /64, this deployment's own
#   ORPHEUM_TUNNEL_MTU the tunnel's MTU
#   ORPHEUM_TUNNEL_IPV4, ORPHEUM_TUNNEL_IPV6   this deployment's end of the tunnel
#
# The directory holds tunnel/ (wg0.conf and its keys), core/ and node/ (the instances) and run/
# (their sockets).
#
# Each service with a network of its own turns MPTCP off in it (CVE-2026-98432, a use-after-free
# reached through MPTCP listeners): the setting is each network's own, so the host's does not reach
# it, and a household's kernel is not ours. The core shares the tunnel's network, whose setting it
# has; Docker refuses a net.* sysctl to a service that shares another's.

services:
  # The core's end of the tunnel to the VPS (D243 §7). The core shares its network, so the tunnel is
  # in the core's network and nowhere else; it needs CAP_NET_ADMIN for that network only. Port
  # 443 and the relay's are bound inside this network by the core, as a user: the sysctl, which is
  # this network's own, lets it.
  orpheum-tunnel:
    image: ${ORPHEUM_IMAGE:?}
    user: "0:0"
    entrypoint: ["/usr/local/bin/orpheum-tunnel"]
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
      net.mptcp.enabled: "0"
    environment:
      ORPHEUM_TUNNEL_MTU: ${ORPHEUM_TUNNEL_MTU:-1420}
      ORPHEUM_TUNNEL_IPV4: ${ORPHEUM_TUNNEL_IPV4:?}
      ORPHEUM_TUNNEL_IPV6: ${ORPHEUM_TUNNEL_IPV6:?}
    volumes:
      - ./tunnel:/etc/orpheum-tunnel:ro
    ports:
      - "${ORPHEUM_HTTP_PUBLISH:-0.0.0.0}:${ORPHEUM_HTTP_PORT:-8440}:8440"
      # A browser on this machine alone, as from home (D334 §4): its loopback, the same port inside.
      - "127.0.0.1:${ORPHEUM_THIS_MACHINE_PORT:-8441}:${ORPHEUM_THIS_MACHINE_PORT:-8441}"
      - "${ORPHEUM_HTTP_PUBLISH:-0.0.0.0}:${ORPHEUM_LAN_HTTPS_PORT:-8443}:443"
      # WebRTC from devices at home, on the same port inside, which the core offers them (D300).
      - "${ORPHEUM_HTTP_PUBLISH:-0.0.0.0}:${ORPHEUM_LAN_WEBRTC_PORT:-8443}:${ORPHEUM_LAN_WEBRTC_PORT:-8443}/udp"
    networks: [outside]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ip", "link", "show", "wg0", "up"]
      interval: 10s
      start_period: 10s

  # The server: the API, the web client, HTTPS through the tunnel, the voice relay.
  orpheum-core:
    image: ${ORPHEUM_IMAGE:?}
    user: "${ORPHEUM_UID:-10001}:${ORPHEUM_GID:-10001}"
    command: ["core", "--instance", "/var/lib/orpheum/core"]
    network_mode: service:orpheum-tunnel
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./core:/var/lib/orpheum/core
      - ./run:/run/orpheum
    depends_on:
      orpheum-tunnel:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    healthcheck:
      # /api/v1/health answers while the server starts, migrates or is degraded, and says which.
      # wg0 must be in its network: a restart of the tunnel's container alone gives the tunnel a
      # new network this core is not in, which recreating both mends (./staging does).
      test: ["CMD", "bash", "-c", "test -e /sys/class/net/wg0 && exec 3<>/dev/tcp/127.0.0.1/8440 && printf 'GET /api/v1/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      start_period: 60s

  # The media node (D233 §2): every file read and FFmpeg run, confined (D193 §7). It reaches the
  # core by the sockets in run/ only, so it has no network.
  orpheum-node:
    image: ${ORPHEUM_IMAGE:?}
    user: "${ORPHEUM_UID:-10001}:${ORPHEUM_GID:-10001}"
    command: ["node", "--instance", "/var/lib/orpheum/node"]
    network_mode: none
    sysctls:
      net.mptcp.enabled: "0"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./node:/var/lib/orpheum/node
      - ./run:/run/orpheum
    depends_on:
      orpheum-core:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "test", "-S", "/run/orpheum/node/node.sock"]
      interval: 10s
      start_period: 30s

networks:
  # The tunnel dials the VPS over IPv6, which the house has natively (DS-Lite); Docker gives the
  # network IPv6 from a private range and translates it on the way out, as it does IPv4.
  outside:
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${ORPHEUM_OUTSIDE_IPV6_SUBNET:-fd77:5e::/64}
