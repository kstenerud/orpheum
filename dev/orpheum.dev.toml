# SPDX-License-Identifier: GPL-3.0-or-later
# The development configuration: opinionated, local, and loud. `make dev-config` renders it to
# .dev/orpheum.toml, filling in {root} (the repository) and {ffmpeg_dir} (the pinned FFmpeg from
# `make ffmpeg`), and prints the result. The file holds only what must exist before the
# database opens (D182 §3, D200); a key the file lacks runs on its starting value and doctor lists
# it (D202). Everything else is a setting in the database, and dev's values come from dev/seed.toml.
#
# Every value here is a choice for debugging, not a production default:
#   - listen on loopback only, plain HTTP. Browsers treat localhost as a secure context, so the
#     microphone works here; a phone on the LAN needs the real HTTPS name (cut-a §2).
#   - debug logs as text, not JSON, because a person reads them.
#   - confinement reported but not required, so the loop runs on a machine without Landlock
#     and says so (D112).
#   - media read-only, from the generated dev library (make dev-media).

[server]
listen = "127.0.0.1:8432"
data_dir = "{root}/.dev/state"
cache_dir = "{root}/.dev/cache"
read_header_timeout_s = 10
shutdown_grace_s = 10
socket_dir = "{root}/.dev/run"   # /run/orpheum in production, made by systemd

[database]
read_connections_minimum = 4
migrate_free_space_db_multiple = 3

[node]
name = "local"
roots = ["{root}/.dev/media/movies", "{root}/.dev/media/shows"]   # one per library in dev/seed.toml
ffmpeg_dir = "{ffmpeg_dir}"
confinement_policy = "report"   # "require" refuses to start unconfined; "report" runs and says so
video_extensions = ["mkv", "mp4", "m4v", "avi", "mov", "wmv", "ts", "m2ts", "mts", "webm", "mpg", "mpeg", "vob", "flv", "ogv", "3gp"]
subtitle_extensions = ["srt", "ass", "ssa", "vtt"]
max_errors_per_root = 1000
probe_timeout_s = 60
status_interval_s = 10
prepared_dir = "{root}/.dev/cache/prepared"
prepared_budget_gib = 5            # the sandbox's disk is small; a real node's starts at 200
prepared_grace_h = 72
prepared_disk_used_limit_percent = 95

[log]
level = "debug"
format = "text"
